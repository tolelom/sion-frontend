name: Sion Frontend CI/CD

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      # ── E2E (Playwright) ────────────────────────────────────────────────
      # backend repo를 함께 checkout해서 in-memory SQLite 모드로 띄운 뒤
      # 실제 브라우저에서 통합 시나리오를 검증한다.
      - name: Backend repo 체크아웃
        uses: actions/checkout@v4
        with:
          repository: tolelom/sion-backend
          ref: master
          path: backend-src

      - name: Go 설정 (backend 빌드용)
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend-src/go.sum

      - name: Backend 빌드
        working-directory: backend-src
        # CGO_ENABLED=0: glebarez/sqlite는 pure-Go라 CGO 불필요
        run: CGO_ENABLED=0 go build -o /tmp/sion-backend .

      - name: Backend 백그라운드 실행 (in-memory)
        env:
          SION_USE_IN_MEMORY_DB: 'true'
          PORT: '8001'
          ALLOWED_ORIGINS: 'http://localhost:5173'
        run: |
          /tmp/sion-backend > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # /api/health가 응답할 때까지 최대 30초 대기
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/health > /dev/null; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend가 30초 안에 뜨지 않음"
          cat /tmp/backend.log
          exit 1

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: E2E 테스트
        env:
          CI: 'true'
          E2E_BACKEND_URL: 'http://localhost:8001'
        run: npm run test:e2e

      - name: E2E 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Backend 종료
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi

      - name: Backend 로그 출력 (디버깅용)
        if: failure()
        run: cat /tmp/backend.log || true

      # ── 배포 이미지 빌드 ───────────────────────────────────────────────
      - name: 빌드
        run: npm run build

      - name: QEMU 설정
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/tolelom/sion:latest
          platforms: linux/arm64
        # 배포 서버는 GHCR에서 latest 이미지를 직접 polling/watch해 자동으로 갱신한다.
        # 따라서 CI 측에서는 별도 SSH 배포 단계가 필요 없다.